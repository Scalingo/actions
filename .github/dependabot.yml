version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/create-pull-request"
    allow:
      - dependency-type: "direct"
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 10
    labels:
      - "T: Deps"
    schedule:
      interval: "monthly"
      time: "06:00"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
