---
name: ShellCheck GitHub Action
description: |
  Execute ShellCheck in a GitHub Action.

permissions:
  actions: read
  contents: read

inputs:
  version:
    description: |
      ShellCheck version to use. This should match a Docker Hub tag.
      See https://hub.docker.com/r/koalaman/shellcheck/tags for a list of
      available tags.
    required: false
    default: "v0.11.0"

  severity:
    description: |
      ShellCheck severity to use.
      One of 'error', 'warning', 'info', or 'style'.
    required: false
    default: "style"

  files:
    description: |
      List of files to scan.
      When unset, defaults to recursively scanning all .sh files in the repo.
      Each line may be a literal path or a glob expression.
      Use the following syntax to specify a list of files:

          with:
            files: |
              first.sh
              second/*.sh

    required: false
    default: ""

  enable_all_checks:
    description: |
      When set to 'true', instructs ShellCheck to run all tests it knows, even
      optional ones that are not enabled by default.
      Run `shellcheck --list-optional` for the list of optional checks that are
      disabled by default.
      Equivalent to running with the `--enable=all` flag.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5

    - name: Run ShellCheck
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        SEVERITY: ${{ inputs.severity }}
        VERSION: ${{ inputs.version }}
        ALL_CHECKS: ${{ inputs.enable_all_checks }}
      run: |
        docker run --rm \
            --env FILES \
            --env SEVERITY \
            --env ALL_CHECKS \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" \
            --volume "${GITHUB_ACTION_PATH}:${GITHUB_ACTION_PATH}:ro" \
            --workdir "${GITHUB_WORKSPACE}" \
            koalaman/shellcheck-alpine:${VERSION} \
            /bin/sh "${GITHUB_ACTION_PATH}/scripts/run-shellcheck.sh"
